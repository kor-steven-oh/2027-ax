<!doctype html>
<html lang="ko" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <meta name="description" content="사업부의 난제를 AI로 함께 푸는 S.LSI AX Challenge 2027.">
  <title>S.LSI AX Challenge 2027</title>
  <link rel="stylesheet" href="hero.css">
  <script defer src="billboard.js"></script>
  <script defer src="hero.js"></script>
</head>
<body>
  <main class="hero">
    <header><span class="brand">S.LSI</span><span class="event">AX Challenge</span><span class="year">2027</span></header>
    <section class="theater" aria-label="AX 챌린지 영상과 인터랙티브 전광판">
      <div class="picture" role="group" aria-label="입체 전광판. 마우스, 터치 또는 방향키로 시점을 움직일 수 있습니다.">
        <img src="assets/ax/44-corner-led.jpg" id="plaza" alt="코엑스 광장을 모티프로 한 대형 코너 전광판">
        <canvas id="board" width="1600" height="900" aria-hidden="true"></canvas>
        <video muted playsinline preload="metadata" poster="assets/ax/01-book.jpg" src="ax-match-cut.mp4" aria-label="여러 전문 분야에서 발견한 AX를 연결한 10초 영상"></video>
      </div>
      <div class="controls">
        <button id="play" type="button">영상 재생</button>
        <div class="track" aria-hidden="true"><i></i></div>
        <span id="clock">00:00 / 00:10</span>
        <button id="skip" type="button">전광판 보기 ↗</button>
        <button id="sound" type="button" aria-pressed="false">소리 켜기</button>
      </div>
    </section>
    <div class="intro"><h1>사업부의 난제,<br class="mobile"> 우리의 도전<span>.</span></h1>
      <p>현업의 전문성과 AI 역량을 모아<br>사업부의 핵심 문제를 해결합니다.</p>
    </div>
  </main>
</body>
</html>
